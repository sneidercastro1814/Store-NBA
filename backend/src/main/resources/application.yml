server:
  port: ${PORT:8080}

spring:
  application:
    name: hoopstore-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:hoopstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${APP_JWT_SECRET:SuperSecretKeyNBAHoopStoreDefaultKeyMustBeVeryLongAndSecure2024!}
    expiration-ms: 86400000 # 24 horas
